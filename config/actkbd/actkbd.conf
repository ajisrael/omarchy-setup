# actkbd bindings for the MacBook Pro 12,1 function keys (archeus).
#
# applespi maps all top-row F-keys to plain evdev events with no in-kernel
# consumer (see linux include/uapi/linux/input-event-codes.h):
#   F1/F2 -> KEY_BRIGHTNESSDOWN (224) / KEY_BRIGHTNESSUP (225)
#   F5/F6 -> KEY_KBDILLUMDOWN (229) / KEY_KBDILLUMUP (230)
# actkbd owns them globally (tty1, login, Hyprland alike).
#
# Format per line: <keys>:<events>:<attributes>:<command>
#   - events: key (press), rep (repeat), rel (release); empty defaults to key
#   - attributes: empty list means "run the command via system()"
#   - trailing '&' keeps actkbd non-blocking
#
# The events still reach libinput/Hyprland unchanged. The screen brightness
# keys were previously bound in config/hypr/hyprland.lua (XF86MonBrightness*);
# those binds are removed so nothing double-fires. The F5/F6 keys are bound
# nowhere else.

# Screen brightness: the backlight class device exposes brightness_get, so
# relative steps are safe (unlike the SMC keyboard backlight below). key,rep
# repeats while held.
224:key,rep::/usr/bin/brightnessctl set 5%- &
225:key,rep::/usr/bin/brightnessctl set +5% &

# SMC keyboard backlight: applesmc exposes only brightness_set (no get), so
# kbd-backlight-step tracks state via the LED core cache. Press = 10% step;
# the rep lines make holding repeat at 2% (~60%/s). The two entries for each
# key don't collide - actkbd matches on event type.
229:key::/usr/local/bin/kbd-backlight-step down &
229:rep::/usr/local/bin/kbd-backlight-step down 2% &
230:key::/usr/local/bin/kbd-backlight-step up &
230:rep::/usr/local/bin/kbd-backlight-step up 2% &
