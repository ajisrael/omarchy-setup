# Let inhibitors veto the lid switch. Default (yes) means logind ignores
# inhibitor locks when handling the lid, which would defeat the toggle.
# With this drop-in, lid-awake.service's handle-lid-switch inhibit lock
# (started by ~/.local/bin/lid-sleep) makes closing the lid a no-op instead
# of a suspend. See docs/ in omarchy-setup.
[Login]
LidSwitchIgnoreInhibited=no
