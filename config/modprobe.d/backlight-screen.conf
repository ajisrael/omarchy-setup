# Set the Intel screen backlight to 50% of max right after the i915 driver
# loads. intel_backlight exposes a working brightness_get, so this is a one-shot
# absolute set, not a floor re-assertion like the SMC keyboard LED.
#
# Booted system only: i915 is NOT in the initramfs, so the LUKS prompt keeps
# the firmware brightness. The reroute fires wherever i915 loads, so if i915 is
# ever added to MODULES= in /etc/mkinitcpio.conf, this covers LUKS too.
#
# Same mechanism as the applesmc reroute: modconf bundles /etc/modprobe.d into
# the initramfs, so the directive is inert in the image and fires at every
# modprobe in the booted system. The wait loop tolerates the backlight device
# registering just after i915's modprobe returns. No backslashes here, so the
# modprobe.d backslash-escaping trap does not apply.
install i915 /sbin/modprobe --ignore-install i915; i=0; until [ -e /sys/class/backlight/intel_backlight ] || [ "$i" -ge 25 ]; do sleep 0.2; i=$((i+1)); done; m=$(cat /sys/class/backlight/intel_backlight/max_brightness 2>/dev/null); [ "$m" -gt 0 ] 2>/dev/null && echo $((m/2)) > /sys/class/backlight/intel_backlight/brightness || true
