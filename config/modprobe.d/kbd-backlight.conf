# Set the SMC keyboard backlight to 50% of max right after the applesmc module
# loads. applesmc's LED core initializes the backlight off at load (brightness_set
# only, no brightness_get - see applesmc.c smc::kbd_backlight), so this re-asserts
# a starting level. Covers the LUKS passphrase prompt, where the keys must be
# visible.
#
# Same mechanism as the applespi SPI reroute: modconf bundles /etc/modprobe.d
# into the initramfs, so the install directive fires there too - and at every
# modprobe in the booted system. No backslashes here, so the modprobe.d
# backslash-escaping trap does not apply.
install applesmc /sbin/modprobe --ignore-install applesmc; m=$(cat /sys/class/leds/smc::kbd_backlight/max_brightness 2>/dev/null); [ "$m" -gt 0 ] 2>/dev/null && echo $((m/2)) > /sys/class/leds/smc::kbd_backlight/brightness
